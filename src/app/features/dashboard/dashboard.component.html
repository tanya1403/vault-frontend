<div class="dashboard-shell">
  <!-- Sidebar (200px) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-row">
        <div class="logo-tile">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="white" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <span class="logo-text">VaultLink</span>
      </div>

      <div class="viewer-block">
        <div class="viewer-micro">
          <span class="dot-green"></span>
          VIEWING AS
        </div>
        <div class="viewer-selector">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="var(--blue-brand)">
            <path
              d="M20 7h-9c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM4 3h9c1.1 0 2 .9 2 2v2h-2V5H4v10h2v2H4c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2z" />
          </svg>
          <span class="viewer-name">Kleeto</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="var(--gray-secondary)" class="ms-auto">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">OPERATIONS</div>
      <ul class="nav-links">
        <li class="nav-link" routerLink="request-for-pickup" routerLinkActive="active"
          (click)="onNavClick('request-for-pickup')">
          <svg viewBox="0 0 24 24" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Request for Pickup</span>
          <span class="badge-blue-pill" *ngIf="counts['request-for-pickup'] > 0">{{ counts['request-for-pickup']
            }}</span>
        </li>
        <li class="nav-link" routerLink="pickup-scheduled" routerLinkActive="active"
          (click)="onNavClick('pickup-scheduled')">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span>Pickup Scheduled</span>
          <span class="dot-indicator teal" *ngIf="counts['pickup-scheduled'] > 0"></span>
        </li>
        <li class="nav-link" routerLink="intransit" routerLinkActive="active" (click)="onNavClick('intransit')">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="3" width="15" height="13" />
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
            <circle cx="5.5" cy="18.5" r="2.5" />
            <circle cx="18.5" cy="18.5" r="2.5" />
          </svg>
          <span>Intransit</span>
          <span class="dot-indicator amber" *ngIf="counts['intransit'] > 0"></span>
        </li>
        <li class="nav-link" routerLink="delivered" routerLinkActive="active" (click)="onNavClick('delivered')">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <span>Delivered</span>
        </li>
        <li class="nav-link" routerLink="cancelled-pickup" routerLinkActive="active" (click)="onNavClick('cancelled-pickup')">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" />
          </svg>
          <span>Cancelled Pickup</span>
        </li>
        <li class="nav-link" routerLink="vault-management" routerLinkActive="active">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" /><polyline points="9 12 11 14 15 10" />
          </svg>
          <span>Vault Management</span>
        </li>
      </ul>
    </nav>

    <footer class="sidebar-footer">
      <div class="footer-profile">
        <div class="profile-avatar">KA</div>
        <div class="profile-meta">
          <div class="profile-user">Kleeto-Admin</div>
          <div class="profile-role">Kleeto Operations</div>
        </div>
        <button class="btn-logout" (click)="logout()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </footer>
  </aside>

  <!-- Main Content -->
  <div class="main-area">
    <header class="top-bar">
      <div class="top-left">
        <div class="breadcrumb">
          <ng-container *ngFor="let b of ui.breadcrumb(); let last = last">
            <span>{{ b }}</span>
            <svg *ngIf="!last" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor"
              stroke-width="3">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </ng-container>
        </div>
        <h1 class="top-title">{{ ui.pageTitle() }}</h1>
        <p class="top-subtitle">{{ ui.pageSubtitle() }}</p>
      </div>
      <div class="top-right">
        <button class="top-icon-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </button>
        <button class="top-icon-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
        <button class="btn-export">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Export
        </button>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
