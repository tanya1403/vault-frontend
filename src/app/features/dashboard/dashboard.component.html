<div class="dashboard-wrapper">
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="shield-bg">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
            <path d="M12 2L3 6v6.5c0 5 4.5 9.5 9 11.5 4.5-2 9-6.5 9-11.5V6l-9-4z" fill="#FFF"/>
            <path d="M12 15l3-3-1.4-1.4L12 12.2l-1.6-1.6L9 12l3 3z" fill="#3B82F6"/>
          </svg>
        </div>
        <span class="logo-text">VaultLink</span>
      </div>
    </div>

    <div class="viewing-as-section">
      <div class="section-title"><span class="dot"></span> VIEWING AS</div>
      <div class="view-toggle">
        <!-- <button class="toggle-btn" [class.active]="viewMode === 'HomeFirst'" (click)="viewMode = 'HomeFirst'">HomeFirst</button> -->
        <button class="toggle-btn" [class.active]="viewMode === 'Kleeto'" (click)="viewMode = 'Kleeto'">Kleeto</button>
      </div>
    </div>

    <div class="operations-section">
      <div class="section-title">OPERATIONS</div>
      <ul class="nav-list">
        <li class="nav-item" routerLink="request-for-pickup" routerLinkActive="active" (click)="onNavClick('request-for-pickup')">
          <div class="nav-icon-wrapper">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <span class="nav-label">Request for Pickup</span>
          <span class="badge badge-orange" *ngIf="counts['request-for-pickup'] > 0">{{ counts['request-for-pickup'] }}</span>
        </li>

        <li class="nav-item" routerLink="pickup-scheduled" routerLinkActive="active" (click)="onNavClick('pickup-scheduled')">
          <div class="nav-icon-wrapper">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <span class="nav-label">Pickup Scheduled</span>
          <span class="badge badge-blue" *ngIf="counts['pickup-scheduled'] > 0">{{ counts['pickup-scheduled'] }}</span>
        </li>

        <li class="nav-item" routerLink="intransit" routerLinkActive="active" (click)="onNavClick('intransit')">
          <div class="nav-icon-wrapper">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="6" width="15" height="12" rx="1"/><polygon points="16 10 21 10 22 14 22 18 16 18"/>
              <circle cx="6.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/>
            </svg>
          </div>
          <span class="nav-label">Intransit</span>
          <span class="badge badge-purple" *ngIf="counts['intransit'] > 0">{{ counts['intransit'] }}</span>
        </li>

        <li class="nav-item" routerLink="delivered" routerLinkActive="active" (click)="onNavClick('delivered')">
          <div class="nav-icon-wrapper">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <span class="nav-label">Delivered</span>
          <span class="badge badge-green" *ngIf="counts['delivered'] > 0">{{ counts['delivered'] }}</span>
        </li>

        <li class="nav-item" routerLink="vault-management" routerLinkActive="active">
          <div class="nav-icon-wrapper">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 12 11 14 15 10"/>
            </svg>
          </div>
          <span class="nav-label">Vault Management</span>
        </li>
      </ul>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-footer">
      <div class="avatar">KA</div>
      <div class="profile-info">
        <div class="profile-name">kleeto-Admin</div>
        <div class="profile-role">Kleeto Operations</div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT via child routes -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
