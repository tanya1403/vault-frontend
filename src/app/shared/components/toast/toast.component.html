<div class="toast-container" *ngIf="toasts().length > 0">
  <div *ngFor="let toast of toasts()" 
       class="toast-card" 
       [ngClass]="toast.type"
       (click)="remove(toast.id)">
    <div class="toast-icon">
      <svg *ngIf="toast.type === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <svg *ngIf="toast.type === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
      </svg>
      <svg *ngIf="toast.type === 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
    </div>
    <div class="toast-msg">{{ toast.message }}</div>
    <button class="toast-close">×</button>
  </div>
</div>
